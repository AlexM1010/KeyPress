name: CI

# Keypress is a Windows-first desktop app, so the whole gate runs on Windows:
# robotgo needs cgo and the real Win32 headers, and the artifact we care about
# is the .exe.
# Every branch is gated, not just master: the point of the suite is to catch a
# regression while the work is still in progress, and a gate that only runs
# after the merge has already missed its moment.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vet, test, type-check and build
    runs-on: windows-latest

    # With every branch building on push, a pull request from a branch in this
    # repo would otherwise run the whole suite twice over the same commit. Fork
    # pull requests get no push event here, so they are the one case that still
    # needs the pull_request trigger above.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    env:
      # robotgo drives the real mouse and keyboard through cgo; with CGO
      # disabled it compiles down to its non-cgo stubs and the link fails on
      # undefined symbols. Mirrors CGO_ENABLED in Taskfile.yml. The
      # windows-latest image ships mingw-w64 gcc on PATH, which is what the
      # race detector needs too.
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read from go.mod (go 1.25.0 / toolchain go1.25.12) so the version
          # can never drift from what the module declares.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      # Two suites in one run, split by environment: the plain-TypeScript unit
      # tests in a node environment, and the component tests in jsdom (each of
      # those files opts in with a `// @vitest-environment jsdom` docblock - see
      # vitest.config.ts). Neither needs the frontend built below, and jsdom is a
      # devDependency so `npm ci` above is all the setup there is - no browser is
      # downloaded or launched.
      - name: Test frontend
        working-directory: frontend
        run: npm test

      # main.go does `//go:embed all:frontend/build`, and frontend/build is
      # gitignored - so on a fresh checkout every Go command that loads package
      # main (vet, build) fails until the frontend has been built. This step
      # has to come before any of them.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./backend/...

      # Compiles what `task build` (build/windows/Taskfile.yml -> build:native)
      # compiles, with the same flags, but without going through the wails3
      # CLI: v3 is beta and installing it plus go-task only to re-run steps we
      # already did (bindings are committed, the frontend is built above) buys
      # nothing but flakiness. The one thing skipped is `wails3 generate syso`,
      # so this binary carries no embedded icon/manifest resources - use
      # `task build` locally for a release build.
      - name: Build Windows binary
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/Keypress.exe .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: Keypress-windows-amd64
          path: bin/Keypress.exe
          if-no-files-found: error
