name: CI

# Keypress is a Windows-first desktop app, so the whole gate runs on Windows:
# robotgo needs cgo and the real Win32 headers, and the artifact we care about
# is the .exe.
# Every branch is gated, not just master: the point of the suite is to catch a
# regression while the work is still in progress, and a gate that only runs
# after the merge has already missed its moment.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vet, test, type-check and build
    runs-on: windows-latest

    # With every branch building on push, a pull request from a branch in this
    # repo would otherwise run the whole suite twice over the same commit. Fork
    # pull requests get no push event here, so they are the one case that still
    # needs the pull_request trigger above.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository

    env:
      # robotgo drives the real mouse and keyboard through cgo; with CGO
      # disabled it compiles down to its non-cgo stubs and the link fails on
      # undefined symbols. Mirrors CGO_ENABLED in Taskfile.yml. The
      # windows-latest image ships mingw-w64 gcc on PATH, which is what the
      # race detector needs too.
      CGO_ENABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read from go.mod (go 1.25.0 / toolchain go1.25.12) so the version
          # can never drift from what the module declares.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches local development, and clears the floor in frontend's
          # `engines`. That floor sits *inside* the 20.x range (ESLint 10 wants
          # ^20.19.0), so pinning the bare major '20' left CI depending on
          # setup-node happening to resolve a late enough 20.x.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Ordered cheapest-first, so the fastest signal fails the run soonest.
      # Formatting is a file read and a compare; linting parses; the type check
      # after them is the expensive one. None of the three needs the build.
      - name: Check frontend formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run check

      # Two suites in one run, split by environment: the plain-TypeScript unit
      # tests in a node environment, and the component tests in jsdom (each of
      # those files opts in with a `// @vitest-environment jsdom` docblock - see
      # vitest.config.ts). Neither needs the frontend built below, and jsdom is a
      # devDependency so `npm ci` above is all the setup there is - no browser is
      # downloaded or launched.
      - name: Test frontend
        working-directory: frontend
        run: npm test

      # The two cheapest Go checks there are, and the only ones that run on a
      # bare checkout: neither loads package main, so neither trips the embed
      # error described below. That is why they sit above the frontend build
      # rather than down in the Go block - seconds of signal ahead of a minute
      # of bundling. Separate steps, not two lines of one: a multi-line run: on
      # Windows is pwsh, where only the *last* command's exit code reaches the
      # runner and a failure above it is swallowed.
      #
      # tidy -diff prints what `go mod tidy` would rewrite and exits non-zero if
      # there is anything, without touching the files - so a stale require or a
      # dropped go.sum line fails here instead of surfacing as a confusing build
      # error later.
      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      # Rehashes every module in the download cache against go.sum. Cheap
      # supply-chain check: it catches a dependency whose contents no longer
      # match what this repo recorded.
      - name: Verify module checksums
        run: go mod verify

      # main.go does `//go:embed all:frontend/build`, and frontend/build is
      # gitignored - so on a fresh checkout every Go command that loads package
      # main (vet, build) fails until the frontend has been built. This step
      # has to come before any of them.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet ./...

      # Installed from source rather than via the action, which pins its own
      # Go toolchain and would build the linter against a different one than
      # go.mod asks for. The two steps below share this one binary.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      # `run` does not check formatting in v2. The formatters - gofmt and
      # goimports, both enabled in .golangci.yml - execute only under the `fmt`
      # subcommand, so unformatted Go sails straight past the linter: a function
      # declared `func probeFmtGap( )` is reported by `run` as unused and
      # nothing else. --diff prints the rewrite instead of applying it and exits
      # 1 when there is one, which is what fails this step.
      #
      # Its own step rather than a second line under "Lint Go", for the pwsh
      # exit-code reason given above; ahead of it because parsing is cheaper
      # than the type-checking `run` does. .gitattributes pins *.go to eol=lf,
      # so a Windows checkout does not come back with every file "unformatted".
      - name: Check Go formatting
        run: golangci-lint fmt --diff ./...

      # Loads package main, so it belongs after the frontend build like vet
      # above.
      - name: Lint Go
        run: golangci-lint run ./...

      # The quotes around -coverprofile are load-bearing. `run:` is pwsh here,
      # and it splits an unquoted `-coverprofile=coverage.out` at the dot: go
      # receives `-coverprofile=coverage` and a second argument `.out`, treats
      # that as a package path, and fails the step with "FAIL .out [setup
      # failed]" *after* every test has passed. The same applies to
      # `go tool cover -func=` below.
      #
      # -coverprofile rides along on the race run rather than adding a second
      # pass: instrumentation costs a little, running the whole suite twice
      # costs a lot. -race already forces the atomic count mode, so the profile
      # is accurate without asking for -covermode. No threshold is enforced -
      # the point is only to make the number visible, in the log below and as an
      # artifact at the end.
      - name: Go test
        run: go test -race "-coverprofile=coverage.out" ./backend/...

      # Per-function table plus a `total:` line, so the number is readable in
      # the log without downloading anything. Separate from the step above so
      # that its exit code cannot mask a failing test run.
      - name: Report Go coverage
        run: go tool cover "-func=coverage.out"

      # Reports only vulnerabilities this code can actually reach, by call
      # graph, rather than every advisory touching the dependency tree - which
      # is what makes it quiet enough to gate on. robotgo alone pulls in around
      # twenty transitive modules nobody here chose. Needs network access to
      # vuln.go.dev, and `frontend/build` from the step above, since it loads
      # package main like vet does.
      # Two steps rather than two lines of one, for the pwsh exit-code reason
      # given above the tidy check: this one only gated correctly by accident,
      # because govulncheck happened to be last and a failing `go install` would
      # have been swallowed.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Check for vulnerable dependencies
        run: govulncheck ./...

      # Compiles what `task build` (build/windows/Taskfile.yml -> build:native)
      # compiles, with the same flags, but without going through the wails3
      # CLI: v3 is beta and installing it plus go-task only to re-run steps we
      # already did (bindings are committed, the frontend is built above) buys
      # nothing but flakiness. The one thing skipped is `wails3 generate syso`,
      # so this binary carries no embedded icon/manifest resources - use
      # `task build` locally for a release build.
      - name: Build Windows binary
        run: go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/Keypress.exe .

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: Keypress-windows-amd64
          path: bin/Keypress.exe
          if-no-files-found: error

      # Kept next to the binary upload rather than immediately after the test
      # step: uploads are the slow, networked part of the run, and a run that
      # fails before here has a reason to look at that is not the coverage
      # number. Deliberately a raw profile and no third-party uploader - open it
      # with `go tool cover -html=coverage.out`.
      - name: Upload Go coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
